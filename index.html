<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XP-VM - Windows Browser</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        #canvas-container {
            border: 4px solid #245dd7;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.7);
            background: #000;
            width: 800px;
            height: 600px;
            position: relative;
        }
        #screen {
            width: 100%;
            height: 100%;
        }
        .buttons {
            margin-top: 15px;
        }
        button {
            padding: 10px 15px;
            background: #245dd7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 5px;
            font-weight: bold;
        }
        button:hover { background: #1d4cb8; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <!-- Canvas nativo gestito dal nostro script -->
        <canvas id="screen"></canvas>
    </div>

    <div class="buttons">
        <button onclick="iniettaApp('dance')">💃 Inietta Microsoft Dance</button>
        <button onclick="iniettaApp('games')">🕹️ Inietta Entertainment Pack</button>
        <button onclick="iniettaApp('office')">📁 Inietta Office 2000 Mini</button>
    </div>

    <!-- Carichiamo l'emulatore x86 nativo senza iframe -->
    <script src="https://js-dos.com"></script>
    <script src="script.js"></script>

</body>
</html>
