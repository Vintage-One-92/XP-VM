<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XP-VM - Windows XP nel Browser</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        #canvas-container {
            border: 4px solid #245dd7; /* Il classico blu di Windows XP */
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.7);
        }
        /* Questo garantisce che lo schermo della VM si adatti bene */
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <!-- Qui dentro prenderà vita Windows XP -->
        <canvas id="screen"></canvas>
    </div>

    <!-- Carichiamo la libreria v86 direttamente da internet per ora -->
    <script src="https://copy.sh"></script>
    <!-- Carichiamo il nostro script che comanda la VM -->
    <script src="script.js"></script>

</body>
</html>
